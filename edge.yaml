#cloud-config
# ==============================================================================
# cloud-init-edge.yaml — nodi "edge-node-1".."edge-node-9" (Edge Site, PRISM)
# ------------------------------------------------------------------------------
# STESSO file statico per tutti e 9: nessun placeholder viene sostituito
# (cloudInitEnvs non valorizzato). L'identità del sito è auto-rilevata via
# `hostname` — verificate al primo boot che coincida col friendlyName della
# BiVM (dipende dal datasource cloud-init usato da SLICES-RI).
#
# Ogni Edge Site, come da Fig. 2 del paper, ospita in un unico nodo:
# Kubernetes API (K3s single-node), Knative (Activator + fn), Prometheus,
# Traefik (ingress + routing pesato), e in seguito il Workflow Master
# Controller applicativo di PRISM.
# ==============================================================================

package_update: true
package_upgrade: false

write_files:
  # kube-prometheus-stack locale al sito ("Observability Service" — §III).
  # Grafana disattivato: la Dashboard è centralizzata sul Central Cloud.
  - path: /var/lib/rancher/k3s/server/manifests/prism-observability.yaml
    owner: root:root
    permissions: '0644'
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
      ---
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: kube-prometheus-stack
        namespace: kube-system
      spec:
        chart: kube-prometheus-stack
        repo: https://prometheus-community.github.io/helm-charts
        targetNamespace: monitoring
        createNamespace: true
        valuesContent: |-
          fullnameOverride: prism-observability
          prometheus:
            prometheusSpec:
              retention: 6h
              resources:
                requests: {cpu: 150m, memory: 384Mi}
                limits: {memory: 768Mi}
              # Se volete federare verso il Prometheus del Central Cloud,
              # aggiungete qui un remoteWrite dopo il provisioning (l'IP del
              # cloud-node non è noto a boot-time — vedi scripts/wire-peers.sh):
              # remoteWrite:
              #   - url: "http://<CLOUD_NODE_IP>:30900/api/v1/write"
          kubeControllerManager: {enabled: false}
          kubeScheduler: {enabled: false}
          kubeEtcd: {enabled: false}
          kubeProxy: {enabled: false}
          grafana:
            enabled: false
          alertmanager:
            enabled: false

runcmd:
  # 1) K3s server, Traefik non disabilitato. `hostname` funge da site-id
  #    (es. "edge-node-3") — verificate al boot che coincida col friendlyName.
  - |
    SITE_ID="$(hostname)"
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
      --node-label prism.io/role=edge \
      --node-label prism.io/site=${SITE_ID} \
      --write-kubeconfig-mode 644" sh -

  - |
    until k3s kubectl get nodes | grep -q ' Ready '; do
      sleep 5
    done

  # 2) Knative Serving — CRDs + Core. NIENTE Gateway API CRD qui: non
  #    servono al networking layer scelto (Kourier, vedi step 4) e in più
  #    andrebbero in conflitto con le stesse CRD che il chart traefik-crd
  #    di K3s installa come parte del proprio bundle (root cause del
  #    CrashLoopBackOff osservato su edge-node-1: Helm rifiutava di
  #    importare CRD già create da un `kubectl apply` non-Helm).
  - k3s kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-crds.yaml
  - |
    until k3s kubectl get crd services.serving.knative.dev >/dev/null 2>&1; do
      sleep 3
    done
  - k3s kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-core.yaml

  # 3) net-kourier come networking layer di Knative
  - k3s kubectl apply -f https://github.com/knative/net-kourier/releases/latest/download/kourier.yaml
  - >
    k3s kubectl patch configmap/config-network -n knative-serving --type merge
    -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

  # 3b) Kourier e Traefik sono entrambi Service LoadBalancer di default: su
  #     K3s single-node il ServiceLB integrato può bindare le porte 80/443
  #     a un solo Service per volta. Il secondo che parte resta bloccato
  #     (svclb-* pod in Pending, "didn't have free ports for the requested
  #     pod ports" — osservato su edge-node-1). Traefik resta l'unico
  #     front-door esterno; Kourier diventa interno (ClusterIP), coerente
  #     con l'uso che ne facciamo per il routing pesato via IngressRoute.
  - |
    until k3s kubectl get svc kourier -n kourier-system >/dev/null 2>&1; do
      sleep 3
    done
    k3s kubectl patch svc kourier -n kourier-system -p '{"spec":{"type":"ClusterIP"}}'

  # 4) Magic DNS via sslip.io sull'IP rilevato a runtime
  - |
    NODE_IP=$(hostname -I | awk '{print $1}')
    k3s kubectl patch configmap/config-domain -n knative-serving --type merge \
      -p "{\"data\":{\"${NODE_IP}.sslip.io\":\"\"}}"

  - touch /var/lib/prism-bootstrap-complete
