#cloud-config
package_update: true
packages:
  - curl
  - jq
  - apt-transport-https

write_files:
  - path: /usr/local/bin/prism-bootstrap-edge.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # 1. k3s come control plane INDIPENDENTE (cluster separato dal cloud)
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="--disable traefik --node-label node-role=edge --node-label prism/site=${PRISM_SITE}" \
        sh -s -

      # 2. Helm
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # export UNA SOLA VOLTA, valido per tutto il resto dello script
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      # 3. Knative Serving + Kourier
      kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.15.0/serving-crds.yaml
      kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.15.0/serving-core.yaml
      kubectl apply -f https://github.com/knative/net-kourier/releases/download/knative-v1.15.0/kourier.yaml
      kubectl patch configmap/config-network -n knative-serving --type merge \
        -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

      # 4. Prometheus
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      helm repo update
      kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
        -n monitoring --set grafana.adminPassword=prism-admin

      # 5. Traefik (Ingress/Routing Service)
      helm repo add traefik https://traefik.github.io/charts
      helm repo update
      kubectl create namespace prism-system --dry-run=client -o yaml | kubectl apply -f -
      cat <<'VALUES' > /tmp/traefik-prism-values.yaml
      additionalArguments:
        - "--providers.kubernetescrd.allowCrossNamespace=true"
      ports:
       web:
         nodePort: 30080
       websecure:
         nodePort: 30443
      VALUES
      helm upgrade --install traefik-prism traefik/traefik -n prism-system -f /tmp/traefik-prism-values.yaml


      # 6. Workflow Master (PRISM) - pre-provisionato, inattivo finche' non
      #    diventa master per un workflow (via PrismMasterAssignment)
      git clone --depth 1 <REPO_URL> /tmp/workflow-master
      cd /tmp/workflow-master
 
      docker build -t workflow-master:local .
      docker save workflow-master:local | k3s ctr images import -
 
      kubectl apply -f 00-rbac.yaml
      kubectl apply -f ../prism-crds/00-prismroutingpolicy-crd.yaml
      kubectl apply -f ../prism-crds/02-prismmasterassignment-crd.yaml
 
      cat <<'DEPLOY' | kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workflow-master
        namespace: prism-system
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: workflow-master
        template:
          metadata:
            labels:
              app: workflow-master
          spec:
            serviceAccountName: workflow-master
            containers:
              - name: workflow-master
                image: workflow-master:local
                imagePullPolicy: IfNotPresent
                env:
                  - name: PRISM_SITE
                    value: "${PRISM_SITE}"
                  - name: PRISM_NAMESPACE
                    value: "prism-system"
                  - name: PRISM_FUNCTION_NAMESPACE
                    value: "default"
                  - name: PRISM_TRAEFIK_PORT
                    value: "30080"
                  - name: PRISM_SFCC_KUBECONFIG_PATH
                    value: "/etc/prism/sfcc-kubeconfig/kubeconfig"
                  - name: PRISM_REMOTE_KUBECONFIG_DIR
                    value: "/etc/prism/remote-kubeconfigs"
                volumeMounts:
                  - name: sfcc-kubeconfig
                    mountPath: /etc/prism/sfcc-kubeconfig
                    readOnly: true
                  - name: remote-kubeconfigs
                    mountPath: /etc/prism/remote-kubeconfigs
                    readOnly: true
            volumes:
              - name: sfcc-kubeconfig
                secret:
                  secretName: sfcc-kubeconfig-bivm-reader
                  optional: true
              - name: remote-kubeconfigs
                secret:
                  secretName: remote-kubeconfigs
                  optional: true
      DEPLOY      

runcmd:
  - /usr/local/bin/prism-bootstrap-edge.sh

final_message: "Nodo ${PRISM_SITE} pronto dopo $UPTIME secondi."
