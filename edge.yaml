#cloud-config
package_update: true
packages:
  - curl
  - apt-transport-https
  - ca-certificates
  - software-properties-common
  - jq

write_files:
  - path: /opt/bootstrap-cluster.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      
      # 1. Installa K3s (Traefik viene installato automaticamente)
      curl -sfL https://get.k3s.io | sh -

      # Esporta il kubeconfig per i comandi successivi
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      echo "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> /root/.bashrc

      # Attendi che il demone K3s e il nodo siano pronti
      echo "Attesa che il nodo K3s diventi Ready..."
      sleep 15
      until kubectl get nodes | grep -q "Ready"; do 
        sleep 5; 
      done

      # 2. Installa Helm
      curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
      bash get_helm.sh

      # 3. Installa lo stack kube-prometheus (Prometheus + Grafana + Alertmanager)
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      helm repo update
      helm install prometheus prometheus-community/kube-prometheus-stack \
        --namespace monitoring \
        --create-namespace \
        --set grafana.enabled=true \
        --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false

      # 4. Installa Knative Serving (Core e CRDs)
      KNATIVE_VERSION="knative-v1.13.0"
      
      kubectl apply -f https://github.com/knative/serving/releases/download/${KNATIVE_VERSION}/serving-crds.yaml
      kubectl apply -f https://github.com/knative/serving/releases/download/${KNATIVE_VERSION}/serving-core.yaml

      # Attendi che i pod core di Knative siano creati prima di procedere
      sleep 10

      # 5. Installa Kourier (Ingress controller raccomandato per Knative)
      kubectl apply -f https://github.com/knative/net-kourier/releases/download/${KNATIVE_VERSION}/kourier.yaml

      # Configura Knative per usare Kourier come rete predefinita
      kubectl patch configmap/config-network \
        --namespace knative-serving \
        --type merge \
        --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

      # (Opzionale) Configura il DNS magico di Knative (es. sslip.io) per test immediati
      kubectl apply -f https://github.com/knative/serving/releases/download/${KNATIVE_VERSION}/serving-default-domain.yaml

runcmd:
  # Eseguiamo lo script generato e salviamo i log per poter fare debugging
  - /opt/bootstrap-cluster.sh > /var/log/k8s-bootstrap.log 2>&1
