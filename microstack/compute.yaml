#cloud-config
# MicroStack - nodo COMPUTE (multi-nodo)
# Installa MicroStack, attende che il control sia pronto, ottiene un token di join
# e si unisce al cluster come nodo compute.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - jq
  - apt-transport-https
  - gnupg
  - snapd

write_files:
  - path: /etc/microstack-join.env
    permissions: '0600'
    # CONTROL_HOST e JOIN_SECRET sono sostituiti dal BiVM hook tramite spec.cloudInitEnvs
    content: |
      CONTROL_HOST=${CONTROL_HOST}
      JOIN_SECRET=${JOIN_SECRET}
      JOIN_PORT=8090
      # tempo massimo di attesa del control (secondi)
      JOIN_TIMEOUT=3600

  - path: /usr/local/bin/install-microstack.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      LOG=/var/log/microstack-install.log
      exec > >(tee -a $LOG) 2>&1
      source /etc/microstack-join.env

      if grep -q '\${' /etc/microstack-join.env; then
        echo "CONTROL_HOST o JOIN_SECRET non sostituiti: controllare spec.cloudInitEnvs della BiVM"
        exit 1
      fi

      echo "1 Inizio installazione MicroStack (COMPUTE)"
      echo "Data: $(date)"

      echo "2 Avvio snapd"
      systemctl enable --now snapd
      sleep 10
      echo "snapd status: $(systemctl is-active snapd)"

      echo "2b Mappatura hostname -> IPv4 in /etc/hosts"
      IP4=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
      HN=$(hostname)
      sed -i "/[[:space:]]${HN}\$/d" /etc/hosts
      echo "${IP4} ${HN}" >> /etc/hosts
      echo "hostname ${HN} -> ${IP4}"

      echo "3 Installazione MicroStack snap (stesso canale del control)"
      snap install microstack --beta

      echo "4 Attesa del control su ${CONTROL_HOST}:${JOIN_PORT}"
      START=$(date +%s)
      TOKEN=""
      until TOKEN=$(curl -sf --max-time 60 \
                      -H "X-Join-Secret: ${JOIN_SECRET}" \
                      "http://${CONTROL_HOST}:${JOIN_PORT}/join-token"); do
        if [ $(( $(date +%s) - START )) -ge "$JOIN_TIMEOUT" ]; then
          echo "timeout: control non raggiungibile dopo ${JOIN_TIMEOUT}s"
          exit 1
        fi
        echo "control non ancora pronto, riprovo tra 30s"
        sleep 30
      done
      echo "token di join ottenuto"

      echo "5 Join al cluster come compute"
      microstack init --auto --compute --join "$TOKEN"
      echo "microstack init exit code: $?"

runcmd:
  - [ bash, -c, "/usr/local/bin/install-microstack.sh" ]

final_message: "Installazione compute completata"
