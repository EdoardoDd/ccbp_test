#cloud-config
package_update: true
packages:
  - curl
  - jq
  - apt-transport-https
  - gettext-base
  - subversion

write_files:
  - path: /usr/local/bin/prism-bootstrap-cloud.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="--disable traefik --disable servicelb --node-label node-role=cloud --write-kubeconfig-mode 644" \
        sh -s -

      # helm
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      # knative serving + kourier 
      kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.15.0/serving-crds.yaml
      kubectl apply -f https://github.com/knative/serving/releases/download/knative-v1.15.0/serving-core.yaml
      kubectl apply -f https://github.com/knative/net-kourier/releases/download/knative-v1.15.0/kourier.yaml
      kubectl patch configmap/config-network -n knative-serving --type merge \
        -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

      # prometheus
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      helm repo update
      kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
        -n monitoring --set grafana.adminPassword=prism-admin

      # traefik (Ingress/Routing Service)
      # client-facing + interno
      helm repo add traefik https://traefik.github.io/charts
      helm repo update
      kubectl create namespace prism-system --dry-run=client -o yaml | kubectl apply -f -

      cat <<'VALUES' > /tmp/traefik-prism-values.yaml
      additionalArguments:
        - "--providers.kubernetescrd.allowCrossNamespace=true"
      ports:
        web:
          nodePort: 30080
        websecure:
          nodePort: 30443
        internal:
          port: 8090
          expose:
            default: true
          exposedPort: 8090
          nodePort: 30090
      metrics:
        prometheus:
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: kube-prometheus-stack
          addRoutersLabels: true
          addServicesLabels: true
      VALUES
      helm upgrade --install traefik-prism traefik/traefik -n prism-system -f /tmp/traefik-prism-values.yaml

      # metriche del queue-proxy di Knative (richieste servite e latenze per funzione),
      # lette dal Cloud Controller per il sito cloud-node. Inline perche' cloud-node
      # non clona il repo di workflow-master; tenere allineato a podmonitor-queue-proxy.yaml.
      cat <<'PODMONITOR' | kubectl apply -f -
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: knative-queue-proxy
        namespace: monitoring
        labels:
          release: kube-prometheus-stack
      spec:
        namespaceSelector:
          matchNames:
            - default
        selector:
          matchExpressions:
            - key: serving.knative.dev/revision
              operator: Exists
        podMetricsEndpoints:
          - port: http-usermetric
            path: /metrics
            interval: 15s
      PODMONITOR

      # provisioning della credenziale di scrittura remota 
      cat <<'RBAC' | kubectl apply -f -
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: workflow-master-remote-writer
        namespace: prism-system
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: workflow-master-remote-writer
        namespace: prism-system
      rules:
        - apiGroups: ["traefik.io"]
          resources: ["ingressroutes", "traefikservices"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["services"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: workflow-master-remote-writer
        namespace: prism-system
      subjects:
        - kind: ServiceAccount
          name: workflow-master-remote-writer
          namespace: prism-system
      roleRef:
        kind: Role
        name: workflow-master-remote-writer
        apiGroup: rbac.authorization.k8s.io
      RBAC

      # knative service
      cat <<'RBAC_KNATIVE' | kubectl apply -f -
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: workflow-master-remote-writer-knative
        namespace: default
      rules:
        - apiGroups: ["serving.knative.dev"]
          resources: ["services"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: workflow-master-remote-writer-knative
        namespace: default
      subjects:
        - kind: ServiceAccount
          name: workflow-master-remote-writer
          namespace: prism-system
      roleRef:
        kind: Role
        name: workflow-master-remote-writer-knative
        apiGroup: rbac.authorization.k8s.io
      RBAC_KNATIVE

      SELF_IP=$(hostname -I | awk '{print $1}')
      SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
      SERVER="${SERVER/127.0.0.1/${SELF_IP}}"
      CA_DATA=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
      TOKEN=$(kubectl -n prism-system create token workflow-master-remote-writer --duration=87600h)

      mkdir -p /etc/prism
      cat <<KUBECONFIG > /etc/prism/self-remote-writer-kubeconfig.yaml
      apiVersion: v1
      kind: Config
      current-context: self-remote-writer
      clusters:
        - name: self
          cluster:
            server: ${SERVER}
            certificate-authority-data: ${CA_DATA}
      contexts:
        - name: self-remote-writer
          context:
            cluster: self
            user: workflow-master-remote-writer
      users:
        - name: workflow-master-remote-writer
          user:
            token: ${TOKEN}
      KUBECONFIG
      chmod 600 /etc/prism/self-remote-writer-kubeconfig.yaml

      # function-installer 
      git clone --depth 1 https://${GIT_TOKEN}@github.com/EdoardoDd/function_installer_test /function-installer
      cd /function-installer

      kubectl apply -f rbac.yaml
      kubectl apply -f crds/prism-functiondeployment-crd.yaml
      kubectl apply -f deployment.yaml



runcmd:
  - /usr/local/bin/prism-bootstrap-cloud.sh
