<text class="tk" x="40" y="153.5" text-anchor="end">100</text>
<line class="grid" x1="46" x2="366" y1="121.4" y2="121.4"/>
<text class="tk" x="40" y="124.9" text-anchor="end">300</text>
<line class="grid" x1="46" x2="366" y1="90.0" y2="90.0"/>
<text class="tk" x="40" y="93.5" text-anchor="end">1000</text>
<line class="grid" x1="46" x2="366" y1="61.4" y2="61.4"/>
<text class="tk" x="40" y="64.9" text-anchor="end">3000</text>
<line class="grid" x1="46" x2="366" y1="30.0" y2="30.0"/>
<text class="tk" x="40" y="33.5" text-anchor="end">10000</text>
<text class="tk" x="10" y="120.0" transform="rotate(-90 10 120.0)" text-anchor="middle">ms </text>

<!-- Griglia Asse X (Rate: 25 - 250) -->
<line class="axis" x1="81.6" x2="81.6" y1="210" y2="214"/>
<text class="tk" x="81.6" y="226" text-anchor="middle">50</text>
<line class="axis" x1="152.7" x2="152.7" y1="210" y2="214"/>
