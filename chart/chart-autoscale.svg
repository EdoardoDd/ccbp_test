<line class="axis" x1="46" x2="366" y1="210" y2="210"/>
<text class="tk" x="206.0" y="246" text-anchor="middle">req/s</text>

<!-- p99 (Arancione) -->
<polyline class="s99" points="46.0,154.9 81.6,155.6 117.1,153.8 152.7,153.7 188.2,145.6 223.8,134.9 259.3,109.8 294.9,90.4 366.0,37.8"/>
