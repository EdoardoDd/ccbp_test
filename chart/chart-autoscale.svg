<!-- Legenda -->
<line x1="46" y1="256" x2="66" y2="256" stroke="#1F5F99" stroke-width="2.2"/>
<text class="lg" x="70" y="259">p50</text>
<line x1="105" y1="256" x2="125" y2="256" stroke="#388E3C" stroke-width="2.2"/>
