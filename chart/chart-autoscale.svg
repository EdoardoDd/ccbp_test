<svg viewBox="0 0 380 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Latenza e Throughput - workload autoscale-go">
<style>
  .bg{fill:#ffffff}
  .ct{font:600 12px system-ui,sans-serif;fill:#1B2124}
  .tk{font:10px ui-monospace,monospace;fill:#58646B}
  .lg{font:11px system-ui,sans-serif;fill:#1B2124}
  .grid{stroke:#D8DEE0;stroke-width:1}
  .axis{stroke:#58646B;stroke-width:1}
  .s50{fill:none;stroke:#1F5F99;stroke-width:2.2}
  .s90{fill:none;stroke:#388E3C;stroke-width:2.2}
  .s99{fill:none;stroke:#C77A1E;stroke-width:2.2}
  .s50d{fill:#1F5F99}
  .s90d{fill:#388E3C}
  .s99d{fill:#C77A1E}
</style>
<rect class="bg" x="0" y="0" width="380" height="270"/>
<text class="ct" x="46" y="16">Latenza workload: autoscale-go</text>

<!-- Griglia Asse Y (Latenza Logaritmica) -->
<line class="grid" x1="46" x2="366" y1="210.0" y2="210.0"/>
<text class="tk" x="40" y="213.5" text-anchor="end">10</text>
<line class="grid" x1="46" x2="366" y1="181.3" y2="181.3"/>
<text class="tk" x="40" y="184.8" text-anchor="end">30</text>
